name: Build Discovery Uttarakhand Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: '12266719'
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.0.12077973

      - name: Set up Flutter SDK (Stable 3.27.4)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart Version
        run: |
          flutter --version
          dart --version

      - name: Clean & Get Dependencies
        working-directory: ./mobile_app
        run: |
          flutter clean
          flutter pub get

      - name: Build Android Universal Release APK
        working-directory: ./mobile_app
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --android-skip-build-dependency-validation

      - name: Locate and Stage APK
        run: |
          mkdir -p dist-apk
          APK_PATH=$(find mobile_app/build -name "app-release.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find mobile_app/build -name "*.apk" -type f | head -1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" dist-apk/Discover-Uttarakhand-v1.1.0.apk
          ls -lh dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Discover-Uttarakhand-Android-APK-v1.1.0
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Official Global GitHub Release v1.1.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.0
          name: "🏔️ Discovery Uttarakhand Mobile App v1.1.0 (Official Production Release)"
          body: |
            # 🏔️ Discovery Uttarakhand — Official Android Mobile App (v1.1.0)

            ### 📲 Direct 1-Click APK Download:
            - **[Discover-Uttarakhand-v1.1.0.apk](https://github.com/${{ github.repository }}/releases/download/v1.1.0/Discover-Uttarakhand-v1.1.0.apk)**

            ---

            ### 🌟 Key Features & Capabilities:
            1. **Full 1:1 Web Parity**:
               - Spiritual shrines, Cultural heritage, Adventures & Rafting, Verified Mountain Homestays, and 3-Layer Fleet Rentals.
            2. **Real-Time WebSocket AI Copilot**:
               - Sub-second streaming mountain assistance with ground-verified routing and zero-latency WebSocket communication.
            3. **Emergency Mountain SOS & SDRF Mesh**:
               - 1-second press-and-hold panic trigger, satellite telemetry coordinates, direct 1070/112 helplines, and WhatsApp broadcast.
            4. **Spatial GIS Mountain Map**:
               - Interactive elevation contours, corridor statuses, and 1-tap smart contract escrow booking.
            5. **100% Real Photography Pipeline**:
               - Multi-source photographic engine (Pexels + Unsplash verified records) — zero generic AI art.
            6. **Clean Alpine Theme System**:
               - Unified 2-color brand palette (`#0f3d2e` Deep Himalayan Emerald + `#00FF88` Glow) with clean white surfaces.

            ---

            ### ⚙️ Quick Installation Guide:
            1. If you have an older development version installed, uninstall it first.
            2. Download **[Discover-Uttarakhand-v1.1.0.apk](https://github.com/${{ github.repository }}/releases/download/v1.1.0/Discover-Uttarakhand-v1.1.0.apk)**.
            3. Tap the downloaded APK in your Downloads folder to install.
            4. If Google Play Protect shows a prompt, select **"More details"** -> **"Install anyway"**.
          files: dist-apk/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### 🚀 Discover Uttarakhand APK v1.1.0 Released Globally!" >> $GITHUB_STEP_SUMMARY
          echo "Direct Download: [Discover-Uttarakhand-v1.1.0.apk](https://github.com/${{ github.repository }}/releases/download/v1.1.0/Discover-Uttarakhand-v1.1.0.apk)" >> $GITHUB_STEP_SUMMARY
