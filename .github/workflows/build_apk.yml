name: Build Discovery Uttarakhand Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: '12266719'
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.0.12077973

      - name: Set up Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart Version
        run: |
          flutter --version
          dart --version

      - name: Clean & Get Dependencies
        working-directory: ./mobile_app
        run: |
          flutter clean
          flutter pub get

      - name: Build Android Universal Release APK
        working-directory: ./mobile_app
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --target-platform android-arm,android-arm64,android-x64

      - name: Locate and Stage APK
        run: |
          mkdir -p dist-apk
          echo "Scanning filesystem for built APKs..."
          find . -name "*.apk" -type f -ls || true
          APK_PATH=$(find . -name "app-release.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*release*.apk" -type f | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file found in build directory!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" dist-apk/Discover-Uttarakhand-v1.2.0-Release.apk
          ls -lh dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Discover-Uttarakhand-Android-APK-v1.2.0
          path: dist-apk/Discover-Uttarakhand-v1.2.0-Release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Official Global GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.0' }}
          name: "📱 Discovery Uttarakhand Mobile App v1.2.0 — Himalayan AI Copilot Edition (Latest)"
          body: |
            # 🏔️ Discovery Uttarakhand — Android Mobile App v1.2.0
            > **Himalayan AI Copilot Edition** — The most complete mountain travel intelligence app for Uttarakhand.

            ---

            ## 📲 DIRECT 1-CLICK APK DOWNLOAD
            👇 **Tap the `.apk` file directly on your Android phone — no unzipping needed:**

            👉 **[⬇️ Download Discover-Uttarakhand-v1.2.0-Release.apk](https://github.com/${{ github.repository }}/releases/download/v1.2.0/Discover-Uttarakhand-v1.2.0-Release.apk)** 👈

            > 📦 *Direct Android Package • ~57 MB • No account or Play Store required*

