name: Build Discovery Uttarakhand Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: '12266719'
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.0.12077973

      - name: Set up Flutter SDK (Stable 3.27.4)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart Version
        run: |
          flutter --version
          dart --version

      - name: Clean & Get Dependencies
        working-directory: ./mobile_app
        run: |
          flutter clean
          flutter pub get

      - name: Build Android Universal Release APK
        working-directory: ./mobile_app
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --android-skip-build-dependency-validation

      - name: Locate and Stage APK
        run: |
          mkdir -p dist-apk
          echo "Scanning filesystem for built APKs..."
          find . -name "*.apk" -type f -ls || true
          APK_PATH=$(find . -name "app-release.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*release*.apk" -type f | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file found in build directory!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" dist-apk/Discover-Uttarakhand-v1.1.0-Release.apk
          ls -lh dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Discover-Uttarakhand-Android-APK-v1.1.0
          path: dist-apk/Discover-Uttarakhand-v1.1.0-Release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Official Global GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          name: "📱 Direct APK Download — Discovery Uttarakhand Mobile App v1.1.0 (Latest Official Release)"
          body: |
            # 🏔️ Discovery Uttarakhand — Android Mobile App (Official Release)

            ### 📲 DIRECT 1-CLICK APK DOWNLOAD (NO ZIP):
            👇 **Directly tap the raw `.apk` file below on your phone to install without unzipping:**

            👉 **[Download Discover-Uttarakhand-v1.1.0-Release.apk](https://github.com/${{ github.repository }}/releases/download/v1.1.0/Discover-Uttarakhand-v1.1.0-Release.apk)** 👈

            *(Direct Android Package File `.apk` — Size: ~57 MB)*

            ---

            ### ⚡ Quick Install Guide:
            1. **Download APK**: Tap the direct `.apk` link above.
            2. **Uninstall Old Build**: If an older version is already installed on your phone, uninstall it first.
            3. **Open & Install**: Open your phone's *Downloads* folder and tap on `Discover-Uttarakhand-v1.1.0-Release.apk`.
            4. **Play Protect Prompt**: If you see *"Blocked by Play Protect"* / *"Unrecognized Developer"*:
               - Tap **"More details"** (या 'अधिक विवरण').
               - Tap **"Install anyway"** (या 'फिर भी इंस्टॉल करें').
            5. **Done!** Launch Discovery Uttarakhand and enjoy full Himalayan Ground Intelligence.

            ---

            ### 🌟 Included Features:
            - **1:1 Full Web Parity**: Spiritual Dham corridors, Cultural trails, Alpine adventures, Verified stays, and 3-Layer vehicle rentals.
            - **Real-Time WebSocket AI Copilot**: Sub-second streaming conversational assistant with ground-verified data.
            - **Emergency Mountain SOS**: 1-second press-and-hold panic trigger, SDRF satellite coordinates broadcast, and 1-tap WhatsApp alert.
            - **Spatial GIS Interactive Map**: Topographic relief contours, corridor safety status, and 1-tap smart contract escrow booking.
            - **100% Real Photography Pipeline**: Multi-source photographic engine — zero AI art.
            - **Clean Alpine Theme**: Unified 2-color brand palette (`#0f3d2e` Deep Himalayan Emerald + `#00FF88` Glow) with clean white surfaces.

            ---
            *Universal Architecture (ARM64 / ARMv7 / x86_64) | Flutter 3.27.4 Stable | Android SDK 35*
          files: dist-apk/Discover-Uttarakhand-v1.1.0-Release.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

