name: Build Discovery Uttarakhand Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Explicitly install Android SDK 35 (compileSdkVersion 35 in build.gradle)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: '12266719'
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.0.12077973

      - name: Set up Flutter SDK (Stable 3.27.4)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart Version
        run: |
          flutter --version
          dart --version

      - name: Clean & Get Dependencies
        working-directory: ./mobile_app
        run: |
          flutter clean
          flutter pub get

      - name: Build Android Universal Release APK
        working-directory: ./mobile_app
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --android-skip-build-dependency-validation

      - name: Locate and Stage APK
        run: |
          mkdir -p dist-apk
          APK_PATH=$(find mobile_app/build -name "app-release.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find mobile_app/build -name "*.apk" -type f | head -1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" dist-apk/Discover-Uttarakhand-v1.0.8.apk
          ls -lh dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Discover-Uttarakhand-Android-APK-v1.0.8
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Delete old release tag if exists
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push --delete origin v1.0.8-apk 2>/dev/null || true
          git tag -d v1.0.8-apk 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.8-apk
          name: "🏔️ Discover Uttarakhand Android APK v1.0.8 (Latest Live Build)"
          body: |
            ## 🏔️ Discovery Uttarakhand Android Mobile App — v1.0.8 (Current Live Build)

            ### 📲 Direct APK Download:
            - **[Discover-Uttarakhand-v1.0.8.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.8-apk/Discover-Uttarakhand-v1.0.8.apk)**

            ### ✅ What's Included in v1.0.8:
            - Fully synced with latest commits on `main` branch
            - Real-time WebSocket AI Copilot engine with zero latency
            - Universal Android APK compatibility (ARM64, ARMv7, x86_64)
            - Clean Alpine White & Deep Himalayan Emerald theme matching Web 1:1
            - Spatial GIS Interactive map with live altitude radar & SOS mesh
            - Real photography for 129+ Uttarakhand destinations (Pexels + Unsplash engine)

            ### ⚙️ Install Instructions:
            1. Purani version installed ho toh pehle **Uninstall** karein.
            2. Nayi APK download karein: **[Discover-Uttarakhand-v1.0.8.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.8-apk/Discover-Uttarakhand-v1.0.8.apk)**
            3. File tap karke install karein (Play Protect pop-up aaye to *More details -> Install anyway* tap karein).
          files: dist-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### 🚀 Discover Uttarakhand APK v1.0.8 Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "Direct Download: [Discover-Uttarakhand-v1.0.8.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.8-apk/Discover-Uttarakhand-v1.0.8.apk)" >> $GITHUB_STEP_SUMMARY
