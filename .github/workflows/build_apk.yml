name: Build Discovery Uttarakhand Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Print Flutter & Dart Version
        run: |
          flutter --version
          dart --version

      - name: Clean Previous Flutter Builds
        run: flutter clean

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Build Android APKs (Release & Debug)
        run: |
          flutter build apk --release --no-tree-shake-icons
          flutter build apk --debug

      - name: Locate and Package APKs
        run: |
          mkdir -p ../dist-apk
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk ../dist-apk/Discover-Uttarakhand-v1.0.2.apk
          elif [ -f "build/app/outputs/apk/release/app-release.apk" ]; then
            cp build/app/outputs/apk/release/app-release.apk ../dist-apk/Discover-Uttarakhand-v1.0.2.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            cp build/app/outputs/flutter-apk/app-debug.apk ../dist-apk/Discover-Uttarakhand-v1.0.2-Debug.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Discover-Uttarakhand-Android-APK-v1.0.2
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.2-apk
          name: "Discover Uttarakhand Android APK v1.0.2 (Fresh Build)"
          body: |
            ## 🏔️ Discovery Uttarakhand Android App v1.0.2

            **Direct 1-Click APK Download** (Fresh Build with AI Copilot + Voice Demo + Technical Rental Specs):
            - **[Discover-Uttarakhand-v1.0.2.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.2-apk/Discover-Uttarakhand-v1.0.2.apk)** (Release APK - Recommended)
            - **[Discover-Uttarakhand-v1.0.2-Debug.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.2-apk/Discover-Uttarakhand-v1.0.2-Debug.apk)** (Debug APK - Works on all developer devices)
            
            ### Instructions:
            1. Uninstall any older app version from your phone if installed.
            2. Download `Discover-Uttarakhand-v1.0.2.apk`.
            3. Tap **Install / Allow from this source**.
            4. Open the app!
          files: dist-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Release Notes & Summary
        run: |
          echo "### 🚀 Discovery Uttarakhand Android APK v1.0.2 Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **App Version**: 1.0.2+3" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: Android (APK)" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Download**: [Download Discover-Uttarakhand-v1.0.2.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.2-apk/Discover-Uttarakhand-v1.0.2.apk)" >> $GITHUB_STEP_SUMMARY
