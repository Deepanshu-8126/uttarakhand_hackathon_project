            ---

            ## 🏗️ Build Provenance
            This APK was built entirely by the **GitHub Actions CI pipeline** from source — no manual modifications.
            SHA-256 checksum is attached to the release assets for tamper verification.

            ---

            *🌿 Made with ❤️ for the mountains of Uttarakhand*
            *Universal Architecture (ARM64 / ARMv7 / x86_64) | Flutter 3.27.4 Stable | Android SDK 35*
          files: dist-apk/Discover-Uttarakhand-v1.2.0-Release.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

