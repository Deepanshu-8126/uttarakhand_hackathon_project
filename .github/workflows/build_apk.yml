name: Build Discovery Uttarakhand Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: '12266719'
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.0.12077973

      - name: Set up Flutter SDK (Stable 3.27.4)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart Version
        run: |
          flutter --version
          dart --version

      - name: Clean & Get Dependencies
        working-directory: ./mobile_app
        run: |
          flutter clean
          flutter pub get

      - name: Build Android Universal Release APK
        working-directory: ./mobile_app
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --android-skip-build-dependency-validation

      - name: Locate and Stage APK
        run: |
          mkdir -p dist-apk
          APK_PATH=$(find mobile_app/build -name "app-release.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find mobile_app/build -name "*.apk" -type f | head -1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" dist-apk/Discover-Uttarakhand-v1.1.0.apk
          ls -lh dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Discover-Uttarakhand-Android-APK-v1.1.0
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Delete old release tag if exists
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push --delete origin v1.1.0 2>/dev/null || true
          git tag -d v1.1.0 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Official GitHub Release v1.1.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.0
          name: "🏔️ Discovery Uttarakhand Mobile App v1.1.0 (Official Production Release)"
          body: |
            # 🏔️ Discovery Uttarakhand — Official Android App Release (v1.1.0)

            **Direct 1-Click APK Download**:
            - 📲 **[Discover-Uttarakhand-v1.1.0.apk](https://github.com/${{ github.repository }}/releases/download/v1.1.0/Discover-Uttarakhand-v1.1.0.apk)**

            ---

            ### 🚀 Highlights & Features in this Release:
            1. **1:1 Full Web Parity Architecture**:
               - Spiritual, Culture, Activities, Mountain Stays, 3-Layer Verified Bike Rentals, and Local Guides.
            2. **Real-Time WebSocket AI Copilot**:
               - Instant conversational mountain intelligence with sub-second streaming responses and fallback redundancy.
            3. **Emergency Mountain SOS & SDRF Mesh**:
               - 1-second press-and-hold panic button, offline telemetry, GPS coordinates broadcast, and instant WhatsApp emergency dispatch.
            4. **Interactive Spatial GIS Map**:
               - Topographic elevation contours, corridor statuses, and 1-tap smart contract escrow booking.
            5. **100% Real Photography Pipeline**:
               - Multi-source photographic engine (Pexels + Unsplash verified records) — zero generic AI art.
            6. **Clean Alpine Theme System**:
               - Unified 2-color brand palette (`#0f3d2e` Deep Himalayan Emerald + `#00FF88` Glow) with clean white surfaces.

            ---

            ### ⚙️ Quick Installation Guide on Android:
            1. Uninstall any older development build if already installed.
            2. Tap **[Discover-Uttarakhand-v1.1.0.apk](https://github.com/${{ github.repository }}/releases/download/v1.1.0/Discover-Uttarakhand-v1.1.0.apk)** to download.
            3. Open Downloads and install.
            4. If Google Play Protect shows a prompt, select **"More details"** -> **"Install anyway"**.
          files: dist-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### 🚀 Discover Uttarakhand APK v1.1.0 Released Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "Direct Download: [Discover-Uttarakhand-v1.1.0.apk](https://github.com/${{ github.repository }}/releases/download/v1.1.0/Discover-Uttarakhand-v1.1.0.apk)" >> $GITHUB_STEP_SUMMARY
