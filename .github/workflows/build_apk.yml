name: Build Discovery Uttarakhand Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart Version
        run: |
          flutter --version
          dart --version

      - name: Clean Previous Flutter Builds
        run: flutter clean

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Verify Code Quality
        run: flutter analyze || true

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Android Debug APK
        run: flutter build apk --debug || true

      - name: Locate and Package APKs
        run: |
          mkdir -p dist-apk
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk dist-apk/Discover-Uttarakhand-v1.0.5.apk
          elif [ -f "build/app/outputs/apk/release/app-release.apk" ]; then
            cp build/app/outputs/apk/release/app-release.apk dist-apk/Discover-Uttarakhand-v1.0.5.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            cp build/app/outputs/flutter-apk/app-debug.apk dist-apk/Discover-Uttarakhand-v1.0.5-Debug.apk
          fi
          ls -la dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Discover-Uttarakhand-Android-APK-v1.0.5
          path: mobile_app/dist-apk/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.5-apk
          name: "Discover Uttarakhand Android APK v1.0.5 (Live Release)"
          body: |
            ## 🏔️ Discovery Uttarakhand Android Mobile App (APK v1.0.5)

            ### 📲 Direct APK Download Links:
            - **[Discover-Uttarakhand-v1.0.5.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.5-apk/Discover-Uttarakhand-v1.0.5.apk)** (Universal Release APK - Recommended)
            - **[Discover-Uttarakhand-v1.0.5-Debug.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.5-apk/Discover-Uttarakhand-v1.0.5-Debug.apk)** (Debug APK - Compatible with all test devices)

            ### What's Inside v1.0.5:
            - 🚨 **Mountain Emergency SOS**: 1-second hold panic button, real-time GPS telemetry, and SDRF instant dispatch with one-tap WhatsApp sharing.
            - 🗺️ **Spatial GIS Mountain Map**: Interactive relief contours, corridor live statuses, and one-tap escrow booking.
            - 🎙️ **Gemini Live AI Voice Companion**: Real-time mountain intelligence, voice synthesizer, and high-altitude advice.
            - 🎟️ **Offline Escrow QR Pass**: Secure blockchain-backed verified booking vouchers.
          files: mobile_app/dist-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
