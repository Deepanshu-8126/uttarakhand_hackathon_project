name: Build Discovery Uttarakhand Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Print Flutter & Dart Version
        run: |
          flutter --version
          dart --version

      - name: Clean Previous Flutter Builds
        run: flutter clean

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Verify Code Quality & Analyze
        run: flutter analyze

      - name: Build Android APKs (Release & Debug)
        run: |
          flutter build apk --release --no-tree-shake-icons
          flutter build apk --debug

      - name: Locate and Package APKs
        run: |
          mkdir -p ../dist-apk
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk ../dist-apk/Discover-Uttarakhand-v1.0.4.apk
          elif [ -f "build/app/outputs/apk/release/app-release.apk" ]; then
            cp build/app/outputs/apk/release/app-release.apk ../dist-apk/Discover-Uttarakhand-v1.0.4.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            cp build/app/outputs/flutter-apk/app-debug.apk ../dist-apk/Discover-Uttarakhand-v1.0.4-Debug.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Discover-Uttarakhand-Android-APK-v1.0.4
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4-apk
          name: "Discover Uttarakhand Android APK v1.0.4 (Full Web Parity + Spatial GIS & Emergency SOS)"
          body: |
            ## 🏔️ Discovery Uttarakhand Android App v1.0.4

            **Direct 1-Click APK Download**:
            - **[Discover-Uttarakhand-v1.0.4.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.4-apk/Discover-Uttarakhand-v1.0.4.apk)** (Release APK - High Performance)
            - **[Discover-Uttarakhand-v1.0.4-Debug.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.4-apk/Discover-Uttarakhand-v1.0.4-Debug.apk)** (Debug APK - Compatible with all test devices)
            
            ### What's Inside:
            - **Full Web Parity**: Spiritual, Culture, Activities, Mountain Stays, 3-Layer Verified Bike Rentals, and Local Mountain Guides.
            - **Emergency Mountain SOS**: 1-second hold panic button, real-time GPS telemetry, and SDRF instant dispatch with one-tap WhatsApp sharing.
            - **Spatial GIS Mountain Map**: Interactive relief contours, corridor live statuses, and one-tap escrow booking.
            - **Intelligent Tech Suite**: AMS altitude safeguards, offline QR escrow vouchers, and Pahadi Coins rewards.
          files: dist-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Release Notes & Summary
        run: |
          echo "### 🚀 Discovery Uttarakhand Android APK v1.0.4 Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **App Version**: 1.0.4+5" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: Android (APK)" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Download**: [Download Discover-Uttarakhand-v1.0.4.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.4-apk/Discover-Uttarakhand-v1.0.4.apk)" >> $GITHUB_STEP_SUMMARY
