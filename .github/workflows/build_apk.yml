name: Build Discovery Uttarakhand Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Print Flutter & Dart Version
        run: |
          flutter --version
          dart --version

      - name: Clean Previous Builds & Get Dependencies
        working-directory: ./mobile_app
        run: |
          flutter clean
          flutter pub get

      - name: Build Android APK
        working-directory: ./mobile_app
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Locate and Stage APKs
        run: |
          mkdir -p dist-apk
          find mobile_app/build -name "*.apk" -exec cp {} dist-apk/Discover-Uttarakhand-v1.0.5.apk \;
          ls -la dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Discover-Uttarakhand-Android-APK-v1.0.5
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.5-apk
          name: "Discover Uttarakhand Android APK v1.0.5 (Universal Build)"
          body: |
            ## 🏔️ Discovery Uttarakhand Android Mobile App (APK v1.0.5)

            ### 📲 Direct APK Download:
            - **[Discover-Uttarakhand-v1.0.5.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.5-apk/Discover-Uttarakhand-v1.0.5.apk)** (Universal Release APK)
            
            ### What's Inside:
            - **Web & Mobile Parity**: 2-Color Brand Architecture (`#0f3d2e` Himalayan Emerald + `#00FF88` Glow).
            - **Emergency Mountain SOS**: 1-sec panic hold, satellite telemetry, WhatsApp broadcast.
            - **Spatial GIS Map**: Topographic contours, mountain hubs, and 1-tap escrow booking.
            - **Verified Fleet**: 3-layer physical and on-chain Polygon verification proof inspect.
          files: dist-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
