name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: Frontend
        env:
          GITHUB_PAGES: 'true'
          VITE_API_BASE_URL: https://uttarakhand-hackathon-project.onrender.com/api
          VITE_API_URL: https://uttarakhand-hackathon-project.onrender.com/api
          VITE_VOICE_BRIDGE_URL: https://uttarakhand-hackathon-project.onrender.com
          VITE_WS_URL: wss://uttarakhand-hackathon-project.onrender.com/ws/voice
          VITE_GEOAPIFY_API_KEY: 2c3a7f1f2e184822a7631d30dfac330c
          VITE_RAZORPAY_KEY_ID: rzp_test_Tfve5JcWu17bY6
          VITE_PEXELS_KEY: Ng530LMnrpm85zReE4lMhjCD7wm5Pc6h8rTE8NfSsuS7be57Qe7C1AGT
        run: npm run build

      - name: Setup GitHub Pages SPA Redirect Script
        working-directory: Frontend/dist
        run: cp index.html 404.html

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
