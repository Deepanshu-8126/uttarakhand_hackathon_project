<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/logo192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#040e09" />
  <meta name="referrer" content="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <meta name="description" content="Discover Uttarakhand — Explore Himalayan destinations, authentic village homestays, verified bike & car rentals, certified mountain guides, and AI-powered travel itineraries across Devbhoomi." />
  <meta name="keywords" content="Uttarakhand travel, Char Dham yatra, Uttarakhand homestays, bike rentals Rishikesh, car rental Dehradun, Nainital stays, Uttarakhand tourism, Himalayan treks" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Discovery Uttarakhand — AI-Powered Regional Travel & Partner Ecosystem" />
  <meta property="og:description" content="Explore verified Himalayan homestays, bike & cab rentals, certified mountain guides, and spiritual circuits across Uttarakhand." />
  <meta property="og:image" content="/logo.png" />
  <meta property="og:site_name" content="Discovery Uttarakhand" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Discovery Uttarakhand — Official Himalayan Travel Platform" />
  <meta name="twitter:description" content="Explore verified homestays, vehicle rentals, local guides, and real-time mountain itineraries across Uttarakhand." />
  <meta name="twitter:image" content="/logo.png" />
  <link rel="canonical" href="https://discoveryuttarakhand.in" />
  <title>Discovery Uttarakhand — Official Travel Portal & Partner Marketplace</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "TravelAgency",
        "@id": "https://discoveryuttarakhand.in/#agency",
        "name": "Discovery Uttarakhand",
        "url": "https://discoveryuttarakhand.in",
        "logo": "https://discoveryuttarakhand.in/logo.png",
        "description": "Regional travel platform offering verified homestays, vehicle rentals, certified local guides, and Himalayan itineraries.",
        "areaServed": {
          "@type": "AdministrativeArea",
          "name": "Uttarakhand, India"
        },
        "currenciesAccepted": "INR",
        "paymentAccepted": "UPI, Credit Card, Debit Card, Escrow Payouts"
      },
      {
        "@type": "WebSite",
        "@id": "https://discoveryuttarakhand.in/#website",
        "url": "https://discoveryuttarakhand.in",
        "name": "Discovery Uttarakhand",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://discoveryuttarakhand.in/destinations?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    ]
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
